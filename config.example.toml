host = "127.0.0.1"
port = 8099
skill_root = "/Users/your-name/.codex/skills/solo-2611"
tasks_dir = "/Users/your-name/claude-runs/solo-2611"

[source]
base_url = "http://localhost:8088"
auth_mode = "cookie"
username = ""
timeout_seconds = 20.0

[execution]
max_containers = 4
run_timeout_seconds = 7200
attempts = 3
stale_after_seconds = 5400

[storage]
disk_floor_gb = 30.0
event_retention_days = 30
skill_log_retention_days = 14

[recording]
max_seconds = 90
chrome_url = "http://127.0.0.1:3000"

[submission]
auto_submit = true
poll_interval_seconds = 300
poll_timeout_seconds = 86400

[dispatch]
engine = "v3"
enabled = true
preset = "balanced"
containers = 4
sessions = 0
authoring = 2
delivering = 1
recording = 1
in_hand = 0
launch_spacing_seconds = 45
session_spacing_seconds = 20
startup_grace_seconds = 20
phantom_seconds = 600
docker_timeout_seconds = 20
docker_stale_seconds = 15
keep_awake = true

[dispatch.elastic]
enabled = false
ceiling = 6
window_seconds = 300
stall_percent = 3.0
severe_attempt = 6
step_up_seconds = 300
cooldown_seconds = 600
stable_seconds = 1800

[dispatch.retry]
max_total_attempts = 8
backoff_seconds = [60, 180, 600]
jitter = 0.2
unknown_retries = 1
engineering_cooldown_failures = 2
engineering_cooldown_hours = 72

[dispatch.guard]
mode = "observe"
run_overtime_factor = 1.25
no_progress_minutes = 30
budget_authoring_minutes = 90
budget_delivering_minutes = 120
budget_recording_minutes = 20
budget_exporting_minutes = 15
zombie_grace_minutes = 5
orphan_container_minutes = 30
leaked_process_minutes = 60
claim_leak_minutes = 30
attempt_inflation = 50

[dispatch.llm_guard]
enabled = true
probe_seconds = 1800
retry_seconds = 30
paused_probe_seconds = 300
fail_threshold = 2
timeout_seconds = 30

[dispatch.disk]
floor_gb = 30.0
resume_factor = 1.2
emergency_gb = 10.0

[dispatch.refill]
mode = "target"
target = 0
daily_claim_cap = 30
allow_reuse = false
engineering_usage_limit = 1
backpressure_threshold = 12
refill_while_paused = false

[dispatch.watchdog]
check_seconds = 30
exit_after_seconds = 300

[dispatch.window]
enabled = false
allow = ["00:00-08:00", "20:00-24:00"]
