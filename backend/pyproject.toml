[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solo-auto"
version = "0.3.0"
description = "solo-auto 2611 local operations console"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.115.*",
  "uvicorn[standard]==0.32.*",
  "pydantic==2.9.*",
  "pydantic-settings==2.6.*",
  "httpx==0.27.*",
  "requests==2.32.*",
  "watchdog==5.0.*",
  "openpyxl==3.1.*",
]

[project.optional-dependencies]
dev = [
  "mypy==1.13.*",
  "pytest==8.3.*",
  "pytest-asyncio==0.24.*",
  "pytest-cov==6.0.*",
  "ruff==0.8.*",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["solo_auto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: invokes the real skill or external services"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests"]
