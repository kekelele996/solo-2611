host = "127.0.0.1"
port = 8099
skill_root = "/Users/your-name/.codex/skills/solo-2611"
tasks_dir = "/Users/your-name/claude-runs/solo-2611"

[source]
base_url = "http://localhost:8088"
auth_mode = "cookie"
username = ""
timeout_seconds = 20.0

[execution]
max_containers = 4
run_timeout_seconds = 10800
attempts = 1
run_mode = "supervised"
open_terminal_on_run = false
continue_max = 2
start_attempts = 2
silent_seconds = 1200
no_progress_seconds = 1200
fatal_hold_minutes = 30
stale_after_seconds = 10800

[storage]
disk_floor_gb = 30.0
event_retention_days = 30
skill_log_retention_days = 14

[recording]
max_seconds = 90
chrome_url = "http://127.0.0.1:3000"

[submission]
auto_submit = true
poll_interval_seconds = 300
poll_timeout_seconds = 86400

[autopilot]
enabled = true
agent_mode = "chatgpt"
agent_bin = ""
agent_args = []
chatgpt_folder_id = ""
chatgpt_push_helper = ""
chatgpt_timeout_seconds = 1800
task_timeout_seconds = 21600
orphan_quiet_seconds = 900
usage_limit_cooldown_seconds = 1800
restricted = false
stage_timeout_seconds = 3600
stage_attempts = 2
run_attempts = 1
parallel_authoring = 2
parallel_delivering = 1
stop_kills_containers = true

[autopilot.breaker]
same_kind_failures = 3
audit_reject_rate = 0.2
audit_reject_window = 10
auto_reset_minutes = 30

[audit]
mode = "sample"
sample_rate = 0.3
stratify_by = "task_type"

[intake]
max_in_hand = 0
exclude_tags = []

[trash]
retention_days = 7

[slim]
enabled = false
after_days = 3
patterns = ["node_modules", ".venv", "dist", "build", "target", "__pycache__"]

[notify]
macos = true

[solo2]
base_url = "https://solo2.jzxhnh.com/app"
username = ""
timeout_seconds = 30.0

[dispatch]
engine = "v3"
enabled = true
mode = "containers"
containers = 4
max_tasks = 5
create_cooldown_seconds = 180
recording = 1
startup_grace_seconds = 20
phantom_seconds = 600
docker_timeout_seconds = 20
docker_stale_seconds = 15
keep_awake = true

[dispatch.retry]
max_total_attempts = 8
engineering_cooldown_failures = 2
engineering_cooldown_hours = 72

[dispatch.guard]
mode = "observe"
run_overtime_factor = 1.25
no_progress_minutes = 30
budget_authoring_minutes = 90
budget_delivering_minutes = 180
budget_recording_minutes = 20
budget_exporting_minutes = 15
zombie_grace_minutes = 5
orphan_container_minutes = 30
leaked_process_minutes = 60
claim_leak_minutes = 30
attempt_inflation = 50

[dispatch.llm_guard]
enabled = true
probe_seconds = 1800
retry_seconds = 30
paused_probe_seconds = 300
fail_threshold = 2
timeout_seconds = 30

[dispatch.disk]
floor_gb = 30.0
resume_factor = 1.2
emergency_gb = 10.0

[dispatch.refill]
mode = "target"
target = 0
daily_claim_cap = 30
allow_reuse = false
engineering_usage_limit = 1
refill_while_paused = false

[dispatch.dispose]
enabled = true
grace_seconds = 30
permanent = false

[dispatch.watchdog]
check_seconds = 30
exit_after_seconds = 300

[dispatch.window]
enabled = false
allow = ["00:00-08:00", "20:00-24:00"]
